<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>文件預覽中...</title>
  <style>
    body, html { margin:0; padding:0; height:100%; background:#0a1a2e; }
    iframe { width:100%; height:100%; border:none; }
    .close-btn {
      position: fixed;
      top: 20px; right: 30px;
      z-index: 9999;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 20px;
      border-radius: 50px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .close-btn:hover { background: #ff4757; }
  </style>
</head>
<body>
  <div class="close-btn" onclick="window.close()">✕ 關閉預覽</div>
  <iframe id="viewer" src=""></iframe>

  <script>
    // 從 URL 取得要預覽的檔案路徑
    const params = new URLSearchParams(location.search);
    const file = params.get('file');
    if (file) {
      // 使用 Google Docs Viewer（支援 PDF, Word, Excel, PPT... 超多格式）
      document.getElementById('viewer').src = 
        `https://docs.google.com/viewer?url=${encodeURIComponent(location.origin + file)}&embedded=true`;
    }
  </script>
</body>
</html>
